
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TapTapCard</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="profile-card">

    <!-- Cover -->
    <div class="cover">
      <img id="coverImage" src="" alt="Cover">
    </div>

    <!-- Profile picture -->
    <div class="profile-picture">
      <img id="profileImage" src="" alt="Profile">
    </div>

    <!-- Name -->
    <h1 id="name">Nom du profil</h1>

    <!-- Description -->
    <p id="description"></p>

    <!-- Social media -->
    <div class="contact-buttons">

  <a id="phoneButton" class="contact-button" href="#">
    ☎
  </a>

  <a id="whatsappButton" class="contact-button" href="#" target="_blank">
    ◉
  </a>

  <a id="mapsButton" class="contact-button" href="#" target="_blank">
    📍
  </a>

</div>

    <div class="footer">
      TapTapCard
    </div>

  </main>

  <script src="app.js"></script>

</body>
      </html>
