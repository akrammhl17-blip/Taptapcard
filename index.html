<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapTap Card</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:340px;
background:#1f2937;
border-radius:20px;
padding:30px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

img{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
}

h1{
margin:5px;
}

p{
color:#cbd5e1;
}

a{
display:block;
text-decoration:none;
background:#2563eb;
color:white;
padding:14px;
margin:12px 0;
border-radius:12px;
font-size:18px;
font-weight:bold;
transition:.3s;
}

a:hover{
background:#1d4ed8;
}
</style>

</head>

<body>

<div class="card">

<img src="https://via.placeholder.com/110" alt="Logo">

<h1>Restaurant Name</h1>

<p>Scan • Tap • Connect</p>

<a href="#">📖 Menu</a>

<a href="#">📱 WhatsApp</a>

<a href="#">📸 Instagram</a>

<a href="#">🎵 TikTok</a>

<a href="#">📘 Facebook</a>

<a href="#">📍 Google Maps</a>

</div>

</body>
</html>
