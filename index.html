<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TapTapCard</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

  <main class="profile-card">

    <!-- Cover -->
    <div class="cover">
      <img id="coverImage" src="" alt="Cover">
    </div>

    <!-- Profile picture -->
    <div class="profile-picture">
      <img id="profileImage" src="" alt="Profile">
    </div>

    <!-- Name -->
    <h1 id="name">Nom du profil</h1>

    <!-- Description -->
    <p id="description"></p>

    <!-- Social media -->
    <div id="socialLinks" class="social-links"></div>

    <!-- Contact buttons -->
    <!-- Social media -->
<div id="socialLinks" class="social-links"></div>

<!-- Contact buttons -->
<div class="contact-buttons">

  <a id="phoneButton" class="contact-button" href="#">
    <i class="fa-solid fa-phone"></i>
  </a>

  <a id="whatsappButton" class="contact-button" href="#" target="_blank">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <a id="mapsButton" class="contact-button" href="#" target="_blank">
    <i class="fa-solid fa-location-dot"></i>
  </a>

  </div>
